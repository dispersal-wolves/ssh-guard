[project]
name = "dispersal-ssh-guard"
version = "0.1.0"
description = "Audit and safely harden OpenSSH servers"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
ssh-guard = "ssh_guard:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["ssh_guard"]
package-dir = {"" = "src"}
